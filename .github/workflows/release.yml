name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  # Gate: run the full quality suite (fmt + clippy + test) before anything is published.
  # A tag with a red build never reaches crates.io.
  verify:
    name: verify
    uses: ./.github/workflows/ci.yml

  publish:
    name: publish to crates.io
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Re-runnable: a crate already on crates.io at this version is skipped, so re-running a
      # release that failed halfway finishes it instead of failing on the first published crate.
      # The order and the tag/version check live in the script.
      - name: Publish
        run: scripts/publish.sh
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
