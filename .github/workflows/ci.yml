name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Reusable: the Release workflow calls this as a gate before publishing.
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  quality:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  generated:
    name: generated apps · fmt-check + type-check (postgres · sqlite · mysql)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build the gize CLI
        run: cargo build -p gize

      - name: Generate apps across dialects + features; each must be rustfmt-clean and type-check
        run: |
          set -euo pipefail
          GIZE="$PWD/target/debug/gize"
          WORK="$(mktemp -d)"; cd "$WORK"

          # A generated app must land rustfmt-clean (ADR-020) and compile. Runtime queries mean
          # `cargo check` needs no database, so every dialect is covered without a DB service.
          check() {
            echo "::group::$1"
            ( cd "$1" && cargo fmt --all -- --check && cargo check )
            echo "::endgroup::"
          }

          # Postgres (default) with OpenAPI + WebSocket + a CRUD resource.
          "$GIZE" new pg --openapi --ws
          ( cd pg && "$GIZE" make crud Product name:String price:i32 active:bool )
          check pg

          # SQLite, versioned API.
          "$GIZE" new lite --database sqlite --api-version 1
          ( cd lite && "$GIZE" make crud Item name:String )
          check lite

          # MySQL with a foreign-key resource.
          "$GIZE" new my --database mysql
          ( cd my && "$GIZE" make crud Order total:i64 buyer:belongs_to:users )
          check my

          echo "OK: generated apps are rustfmt-clean and type-check on postgres, sqlite and mysql"

  bench:
    name: benchmarks · generation speed (informational)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Runs the criterion benchmarks so they never rot and their numbers show up in the logs.
      # The hard regression *gate* is the `generation_stays_within_a_generous_time_budget` test
      # in the `quality` job — a coarse budget that fails on catastrophic slowdowns without
      # flaking on runner variance; criterion here is for tracking the real numbers.
      - name: Run generation benchmarks
        run: cargo bench -p gize-generator

  # Generated apps against real databases (scripts/e2e.sh): every route, auth, pagination,
  # constraint mapping, repeated generation and a schema change with backfill. Runtime SQL
  # errors fail here, not only compile errors. Run the same script locally with
  # `GIZE=target/debug/gize DATABASE=sqlite scripts/e2e.sh`.
  e2e-sqlite:
    name: e2e · SQLite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p gize
      - name: Generate, run and evolve an app
        run: bash scripts/e2e.sh
        env:
          GIZE: target/debug/gize
          DATABASE: sqlite

  e2e-postgres:
    name: e2e · PostgreSQL ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ["14", "16"]
    services:
      postgres:
        image: postgres:${{ matrix.version }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p gize
      - name: Generate, run and evolve an app
        run: bash scripts/e2e.sh
        env:
          GIZE: target/debug/gize
          DATABASE: postgres
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/e2e

  e2e-mysql:
    name: e2e · MySQL ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ["5.7", "8.0"]
    services:
      mysql:
        image: mysql:${{ matrix.version }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: e2e
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot" --health-interval 2s
          --health-timeout 5s --health-retries 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p gize
      - name: Generate, run and evolve an app
        run: bash scripts/e2e.sh
        env:
          GIZE: target/debug/gize
          DATABASE: mysql
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/e2e

  # The minimum supported Rust version promised in STABILITY.md. The workspace is checked with
  # its committed lockfile; the generated app resolves its dependencies fresh, the way a user's
  # first `cargo build` does, so a dependency that drops 1.85 support fails here.
  msrv:
    name: MSRV · Rust 1.85
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      - name: Workspace tests
        run: cargo test --workspace --locked
      # What a user runs. Without --locked, `cargo install` ignores rust-version and picks the
      # newest dependencies, which can need a newer Rust; the documented command must work.
      - name: Install the CLI the documented way
        run: cargo install --locked --path crates/gize --root "$RUNNER_TEMP/gize-install"
      - name: A freshly generated app builds and passes its tests
        run: |
          set -euo pipefail
          cargo build -p gize
          GIZE="$PWD/target/debug/gize"
          WORK="$(mktemp -d)"; cd "$WORK"
          for db in postgres sqlite mysql; do
            "$GIZE" new "app_$db" --database "$db" --openapi --ws
            ( cd "app_$db" && "$GIZE" make crud Item name:String owner:belongs_to:users && cargo test )
          done
